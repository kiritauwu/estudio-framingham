<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudio de Cohorte - Framingham</title>
    <!-- Cargamos Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Cargamos React y Babel -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap');
        
        body {
            font-family: 'Space+Mono', monospace;
            background-color: #050505;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Capa de Efecto CRT (Escaneo) para estilo tecnológico médico */
        .crt-overlay::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.05), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.05));
            z-index: 50;
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
        }

        /* Animaciones dinámicas */
        @keyframes floating {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-1.5cqw) rotate(1deg); }
        }
        
        @keyframes glow-pulse {
            0%, 100% { filter: drop-shadow(0 0 1cqw #3b82f6); }
            50% { filter: drop-shadow(0 0 3cqw #3b82f6); }
        }

        @keyframes bg-slide {
            from { background-position: 0 0; }
            to { background-position: 100px 100px; }
        }

        .animate-float { animation: floating 4s infinite ease-in-out; }
        .animate-glow { animation: glow-pulse 3s infinite ease-in-out; }
        .animate-bg { animation: bg-slide 30s linear infinite; }
        
        .dots-bg {
            background-image: radial-gradient(#3b82f6 1px, transparent 1px);
            background-size: 5cqw 5cqw;
        }

        /* Contenedor Principal estilo Diapositiva 16:9 */
        .canva-presentation {
            container-type: size;
            aspect-ratio: 16 / 9;
            width: 90vw;
            max-width: 1100px;
            background-color: #000;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1.2cqw solid #3b82f6;
            box-shadow: 0 0 50px rgba(59, 130, 246, 0.2);
        }

        .slide-area {
            flex: 1;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .arcade-btn {
            position: relative;
            transition: all 0.1s;
            border-bottom: 0.6cqw solid #000;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .arcade-btn:active {
            transform: translateY(0.3cqw);
            border-bottom-width: 0.1cqw;
        }
    </style>
</head>
<body>
    <div id="root" class="w-full flex justify-center"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            const [step, setStep] = useState(0);
            const [isGlitching, setIsGlitching] = useState(false);

            const triggerNext = () => {
                setIsGlitching(true);
                setTimeout(() => {
                    setStep(prev => (prev === scenes.length - 1 ? 0 : prev + 1));
                    setIsGlitching(false);
                }, 250);
            };

            const triggerPrev = () => {
                if (step === 0) return;
                setIsGlitching(true);
                setTimeout(() => {
                    setStep(prev => prev - 1);
                    setIsGlitching(false);
                }, 250);
            };

            const scenes = [
                {
                    label: "COHORTE INICIAL",
                    color: "#3b82f6",
                    art: (
                        <div className="w-full h-full flex flex-col items-center justify-center relative overflow-hidden">
                            <div className="absolute inset-0 dots-bg animate-bg opacity-20"></div>
                            <div className="flex gap-[4cqw] relative z-10 animate-float">
                                <span className="text-[12cqw] animate-glow">👥</span>
                                <span className="text-[12cqw] animate-glow" style={{animationDelay: '0.5s'}}>🏙️</span>
                            </div>
                            <div className="mt-[3cqw] relative z-10 flex flex-col items-center">
                                <div className="bg-[#f5f5dc] border-[1cqw] border-black px-[6cqw] py-[2cqw] -rotate-2 shadow-[1.5cqw_1.5cqw_0px_0px_#3b82f6]">
                                    <span className="text-[9cqw] font-black italic text-black tracking-tighter leading-none">5,209</span>
                                </div>
                                <div className="mt-[1.5cqw] bg-blue-600 text-white px-[3cqw] py-[0.5cqw] font-bold text-[2.2cqw] rotate-1">SUJETOS SANOS</div>
                            </div>
                        </div>
                    )
                },
                {
                    label: "SEGUIMIENTO",
                    color: "#f59e0b",
                    art: (
                        <div className="w-full h-full flex flex-col items-center justify-center relative">
                            <div className="absolute inset-0 bg-gradient-to-t from-orange-900/10 to-transparent"></div>
                            <div className="flex items-center gap-[4cqw] relative z-10">
                                <div className="text-[18cqw] animate-float">📅</div>
                                <div className="flex flex-col items-center">
                                    <div className="text-orange-500 text-[8cqw] font-black">➜</div>
                                    <div className="text-white text-[2.5cqw] font-bold tracking-[0.4cqw]">LONGITUDINAL</div>
                                </div>
                                <div className="text-[18cqw] p-[3cqw] bg-[#f5f5dc] border-[1cqw] border-orange-500 shadow-[2cqw_2cqw_0px_0px_#000] animate-bounce">🔬</div>
                            </div>
                            <div className="mt-[3cqw] text-white/50 text-[1.8cqw] font-bold uppercase tracking-widest">Iniciado en 1948</div>
                        </div>
                    )
                },
                {
                    label: "FACTORES RIESGO",
                    color: "#ef4444",
                    art: (
                        <div className="w-full h-full flex flex-col items-center justify-center relative">
                            <div className="grid grid-cols-2 gap-[4cqw] relative z-20 scale-90">
                                {['🚬', '🍔', '🩸', '📉'].map((emoji, i) => (
                                    <div key={i} className="relative bg-[#f5f5dc] border-[0.8cqw] border-red-500 p-[2cqw] shadow-[1.2cqw_1.2cqw_0px_0px_#000]">
                                        <span className="text-[10cqw]">{emoji}</span>
                                        <div className="absolute -top-[1.5cqw] -right-[1.5cqw] bg-red-600 text-white w-[5cqw] h-[5cqw] rounded-full flex items-center justify-center border-[0.4cqw] border-black font-black text-[2.2cqw]">!</div>
                                    </div>
                                ))}
                            </div>
                            <div className="absolute inset-0 flex items-center justify-center pointer-events-none z-10">
                                <div className="w-[140%] h-[12cqw] bg-red-600 border-y-[0.8cqw] border-black -rotate-3 flex items-center justify-center shadow-[0_0_5cqw_rgba(239,68,68,0.7)]">
                                    <span className="text-white font-black text-[8.5cqw] tracking-[0.5cqw] uppercase italic">EXPOSICIÓN</span>
                                </div>
                            </div>
                        </div>
                    )
                },
                {
                    label: "INCIDENCIA",
                    color: "#22c55e",
                    art: (
                        <div className="w-full h-full flex flex-col items-center justify-center relative">
                            <div className="absolute inset-0 bg-[radial-gradient(circle_at_center,_rgba(34,197,94,0.1)_0%,_transparent_70%)] animate-pulse"></div>
                            <div className="relative mb-[4cqw] flex flex-col items-center">
                                <div className="text-[20cqw] filter drop-shadow-[0_0_4cqw_#22c55e] animate-float">📊</div>
                                <div className="bg-white text-green-700 px-[5cqw] py-[1cqw] font-black text-[5cqw] border-[0.8cqw] border-black shadow-[1.5cqw_1.5cqw_0px_0px_#000] -mt-[3cqw]">EVIDENCIA</div>
                            </div>
                            <div className="text-white/70 font-bold text-[1.8cqw] text-center max-w-[85%] uppercase tracking-widest leading-relaxed">
                                Descubrimiento de Riesgos Cardiovasculares
                            </div>
                        </div>
                    )
                }
            ];

            return (
                <div className="canva-presentation crt-overlay" style={{borderColor: scenes[step].color}}>
                    
                    {/* Header Académico */}
                    <div className="bg-[#f5f5dc] border-b-[0.8cqw] border-black p-[2.2cqw] flex justify-between items-center z-30">
                        <div className="flex items-center gap-[3cqw]">
                            <div className="w-[8cqw] h-[8cqw] bg-black flex items-center justify-center rotate-6 shadow-[0.6cqw_0.6cqw_0px_0px_#3b82f6]">
                                <span className="text-white font-black text-[4cqw]">{step + 1}</span>
                            </div>
                            <h1 className="text-[6.5cqw] font-black italic tracking-tighter uppercase text-black leading-none">
                                {scenes[step].label}
                            </h1>
                        </div>
                        <div className="flex flex-col items-end">
                            <div className="bg-black text-[#f5f5dc] px-[2cqw] py-[0.4cqw] font-black text-[1.8cqw] -rotate-2 uppercase tracking-tighter">Estudio Framingham</div>
                            <div className="text-black font-bold text-[1.1cqw] tracking-[0.3cqw] mt-1 uppercase">Diseño de Cohorte</div>
                        </div>
                    </div>

                    {/* Área de Visualización */}
                    <div className="slide-area bg-[#080808]">
                        <div className={`w-full h-full transition-all duration-300 ${isGlitching ? 'opacity-30 scale-105 blur-md' : 'opacity-100 scale-100 blur-0'}`}>
                            {scenes[step].art}
                        </div>
                        {isGlitching && (
                            <div className="absolute inset-0 bg-white/5 z-[60] animate-pulse"></div>
                        )}
                    </div>

                    {/* Navegación Visual */}
                    <div className="bg-[#000] p-[2cqw] flex gap-[3cqw] items-stretch z-30">
                        <button 
                            onClick={triggerPrev}
                            disabled={step === 0}
                            className={`arcade-btn flex-[1.5] py-[2cqw] bg-zinc-800 shadow-[0.8cqw_0.8cqw_0px_0px_#111] ${step === 0 ? 'opacity-10 grayscale cursor-not-allowed' : 'hover:bg-zinc-700'}`}
                        >
                            <span className="text-white text-[5cqw] font-black">❮</span>
                        </button>

                        <button 
                            onClick={triggerNext}
                            className="arcade-btn flex-[5] py-[2cqw] shadow-[1cqw_1cqw_0px_0px_rgba(0,0,0,0.5)] transition-colors"
                            style={{backgroundColor: scenes[step].color}}
                        >
                            <div className="flex items-center justify-center">
                                {step === scenes.length - 1 ? (
                                    <span className="text-white text-[7cqw] font-black">⟲</span>
                                ) : (
                                    <span className="text-white text-[7cqw] font-black">➜</span>
                                )}
                            </div>
                            <div className="absolute top-0 left-[-100%] w-full h-full bg-gradient-to-r from-transparent via-white/20 to-transparent skew-x-[45deg] animate-[shine_4s_infinite]"></div>
                        </button>
                    </div>

                    <style>{`
                        @keyframes shine {
                            0% { left: -100%; }
                            15% { left: 100%; }
                            100% { left: 100%; }
                        }
                    `}</style>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
