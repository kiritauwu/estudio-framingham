<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Framingham: La Cohorte Maestra</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Archivo+Black&display=swap');
        
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000; overflow: hidden;
            font-family: 'Archivo Black', sans-serif;
        }

        .crt-container::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
            z-index: 100;
            background-size: 100% 2px, 2px 100%;
            pointer-events: none;
        }

        .cyber-grid {
            background-image: 
                linear-gradient(to right, #1e40af 1px, transparent 1px),
                linear-gradient(to bottom, #1e40af 1px, transparent 1px);
            background-size: 40px 40px;
            mask-image: radial-gradient(circle, black 60%, transparent 100%);
        }

        .timeline-progress {
            height: 6px;
            background: currentColor;
            box-shadow: 0 0 20px currentColor;
            transition: width 0.6s cubic-bezier(0.65, 0, 0.35, 1);
        }

        .btn-action {
            clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
            transition: all 0.2s;
        }
        .btn-action:active { transform: scale(0.95); }

        .text-header-res { font-size: clamp(1.1rem, 5vw, 2.8rem); }
        .text-desc-res { font-size: clamp(0.65rem, 2.5vw, 1.1rem); }
        
        @keyframes pulse-glow {
            0%, 100% { filter: drop-shadow(0 0 5px currentColor); }
            50% { filter: drop-shadow(0 0 20px currentColor); }
        }
        .glow-effect { animation: pulse-glow 2s infinite; }
    </style>
</head>
<body>
    <div id="root" class="w-full h-full"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            const [step, setStep] = useState(0);
            const [anim, setAnim] = useState(false);

            useEffect(() => {
                setAnim(true);
                const t = setTimeout(() => setAnim(false), 400);
                return () => clearTimeout(t);
            }, [step]);

            const scenes = [
                {
                    label: "01_BASE",
                    title: "COHORTE INICIAL",
                    color: "#3b82f6",
                    content: (
                        <div className="flex flex-col items-center">
                            <div className="flex gap-4 md:gap-8 mb-6">
                                <div className="text-center">
                                    <span className="text-6xl md:text-8xl block">👨</span>
                                    <span className="text-blue-400 text-xl font-black">2,336</span>
                                </div>
                                <div className="text-center">
                                    <span className="text-6xl md:text-8xl block">👩</span>
                                    <span className="text-blue-200 text-xl font-black">2,873</span>
                                </div>
                            </div>
                            <div className="bg-white text-black px-6 py-2 -skew-x-12 shadow-[10px_10px_0_#3b82f6]">
                                <span className="text-4xl md:text-6xl font-black">5,209 TOTAL</span>
                            </div>
                            <p className="text-blue-500 font-bold mt-4 tracking-[0.2em] text-[10px] md:text-xs uppercase">Sujetos sanos / Framingham, MA</p>
                        </div>
                    )
                },
                {
                    label: "02_PROCESO",
                    title: "SEGUIMIENTO LINEAL",
                    color: "#f59e0b",
                    content: (
                        <div className="flex flex-col items-center w-full max-w-lg px-4">
                            <div className="flex justify-between w-full mb-8 relative">
                                <div className="absolute top-1/2 left-0 w-full h-1 bg-orange-950 -z-10"></div>
                                <span className="text-5xl bg-black p-2 border-2 border-orange-500">🏁</span>
                                <span className="text-5xl bg-black p-2 border-2 border-orange-500 animate-pulse">🚶‍♂️</span>
                                <span className="text-5xl bg-black p-2 border-2 border-orange-500">📈</span>
                            </div>
                            <div className="bg-orange-500 text-black p-4 rotate-1 shadow-[8px_8px_0_white]">
                                <h2 className="text-2xl md:text-4xl font-black italic">PROSPECTIVO</h2>
                                <p className="text-xs font-bold leading-tight">EXÁMENES FÍSICOS Y ENTREVISTAS CADA 2 AÑOS</p>
                            </div>
                        </div>
                    )
                },
                {
                    label: "03_RIESGOS",
                    title: "EXPOSICIONES",
                    color: "#ef4444",
                    content: (
                        <div className="grid grid-cols-2 gap-4 md:gap-6">
                            {[
                                {e:'🚬', t:'TABAQUISMO'}, {e:'🍔', t:'DIETA ALTA GRASA'}, 
                                {e:'🩸', t:'HIPERTENSIÓN'}, {e:'📉', t:'COLESTEROL'}
                            ].map((item, i) => (
                                <div key={i} className="bg-zinc-950 border-2 border-red-600 p-3 md:p-5 flex flex-col items-center shadow-[5px_5px_0_#000]">
                                    <span className="text-5xl md:text-7xl mb-2">{item.e}</span>
                                    <span className="text-[10px] text-white font-black text-center">{item.t}</span>
                                </div>
                            ))}
                        </div>
                    )
                },
                {
                    label: "04_IMPACTO",
                    title: "DESCUBRIMIENTOS",
                    color: "#10b981",
                    content: (
                        <div className="flex flex-col items-center text-center px-4">
                            <div className="text-7xl md:text-9xl glow-effect text-emerald-500 mb-6">🎯</div>
                            <div className="space-y-2">
                                <div className="bg-white text-black px-4 py-1 text-sm md:text-xl font-black italic">1960: CIGARRILLO ➜ ❤️ INFARTO</div>
                                <div className="bg-emerald-500 text-black px-4 py-1 text-sm md:text-xl font-black italic">1961: COLESTEROL ➜ RIESGO</div>
                                <div className="bg-emerald-200 text-black px-4 py-1 text-sm md:text-xl font-black italic">1967: ACTIVIDAD FÍSICA ➜ PROTECCIÓN</div>
                            </div>
                        </div>
                    )
                }
            ];

            return (
                <div className={`crt-container w-full h-full flex flex-col bg-black border-[10px] transition-all duration-500 overflow-hidden relative`} style={{borderColor: scenes[step].color}}>
                    
                    {/* Header Brutalista */}
                    <div className="bg-white p-3 flex justify-between items-center z-50">
                        <div className="flex items-center gap-3">
                            <div className="bg-black text-white px-3 py-1 text-2xl font-black italic shadow-lg" style={{color: scenes[step].color}}>
                                {step + 1}
                            </div>
                            <h1 className="text-black text-header-res font-black italic tracking-tighter uppercase leading-none">{scenes[step].title}</h1>
                        </div>
                        <div className="text-[9px] font-black text-black/30 tracking-widest hidden sm:block">FRAMINGHAM_STUDY_1948</div>
                    </div>

                    {/* Stage con Progresión Lineal */}
                    <div className="flex-1 relative cyber-grid flex items-center justify-center">
                        <div className="absolute top-0 left-0 w-full z-20">
                             <div className="timeline-progress" style={{ width: `${((step + 1) / scenes.length) * 100}%`, color: scenes[step].color }}></div>
                        </div>
                        
                        <div className={`transition-all duration-300 ${anim ? 'opacity-0 scale-90 translate-x-10' : 'opacity-100 scale-100 translate-x-0'}`}>
                            {scenes[step].content}
                        </div>
                    </div>

                    {/* Controles Arcade */}
                    <div className="p-3 bg-zinc-950 flex gap-3 z-50">
                        <button 
                            onClick={() => step > 0 && setStep(step - 1)}
                            className={`btn-action flex-none px-6 py-3 bg-zinc-800 text-white font-black text-xs ${step === 0 ? 'opacity-10 pointer-events-none' : 'hover:bg-zinc-700'}`}
                        >
                            ATRÁS
                        </button>
                        
                        <button 
                            onClick={() => setStep(prev => (prev === scenes.length - 1 ? 0 : prev + 1))}
                            className="btn-action flex-1 py-3 text-black font-black text-desc-res tracking-[0.2em] shadow-xl uppercase italic"
                            style={{backgroundColor: scenes[step].color}}
                        >
                            {step === scenes.length - 1 ? "REINICIAR ANÁLISIS" : "SIGUIENTE FASE ➜"}
                        </button>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
